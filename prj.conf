# ECDSA-P256 authenticates every firmware image before it is booted.
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="../../../../rsc-boot/keys/dev-signing-public.pem"
CONFIG_BOOT_VALIDATE_SLOT0=y

# STM32F412 has non-uniform erase sectors. The selected partitions use one
# 128 KiB erase sector each, and scratch swap provides rollback support.
CONFIG_BOOT_SWAP_USING_SCRATCH=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=1

# Keep the bootloader small and deterministic.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y

